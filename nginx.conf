events {}

http {
    upstream url_shortner {
        server 127.0.0.1:8181;
        server 127.0.0.1:8182;
        server 127.0.0.1:8183;
        server 127.0.0.1:8184;
        server 127.0.0.1:8185;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://url_shortner
        }
    }
}